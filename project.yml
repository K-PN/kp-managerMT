name: SoNoAI
options:
  bundleIdPrefix: vn.sono
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SoNoAI:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  SoNoAI:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tạp Hóa Mỹ Thạnh
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Thu giọng nói để tạo bản nháp giao dịch khi bạn bấm micro.
        NSSpeechRecognitionUsageDescription: Chuyển lời nói tiếng Việt thành văn bản. Bạn xác nhận trước khi ghi sổ.
        NSCameraUsageDescription: Chụp trang sổ và chứng từ để bạn kiểm tra trước khi nhập.
        NSFaceIDUsageDescription: Mở khóa dữ liệu công nợ trên iPhone này.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: false
        CFBundleDevelopmentRegion: vi
    dependencies:
      - package: SoNoAI
        product: SoNoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.sono.personal
        # Override XcodeGen's iOS target preset (iPhone + iPad).
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  SoNoAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: SoNoAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SoNoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: SoNoAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.sono.personal.uitests
        TEST_TARGET_NAME: SoNoAI
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SoNoAI:
    build:
      targets:
        SoNoAI: all
    test:
      targets: [SoNoAppTests, SoNoUITests]
    archive:
      config: Release
