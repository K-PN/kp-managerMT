# Start workflows manually from Codemagic. No credentials required for ios-verify.
workflows:
  ios-verify:
    name: SoNo AI - Verify iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26.1"
    scripts:
      - name: Prepare tools
        script: bash scripts/ci/bootstrap.sh
      - name: Check workspace and CI scripts
        script: |
          set -euo pipefail
          "$SONO_PYTHON" scripts/check_workspace.py
          "$SONO_PYTHON" -m unittest discover -s scripts/tests -v
      - name: Test financial core
        script: bash scripts/ci/test_core.sh
      - name: Generate iOS project
        script: |
          set -euo pipefail
          "$SONO_PYTHON" scripts/ci/pipeline.py prepare
          xcodegen generate --spec project.ci.json
      - name: Test native app on iPhone Simulator
        script: bash scripts/ci/test_ios.sh
      - name: Package Simulator preview and real screenshots
        script: bash scripts/ci/package_preview.sh
    artifacts:
      - build/preview/*.zip
      - build/screenshots/**/*
      - build/logs/*.log
      - build/test-results/*.xcresult
      - build/test-results/*.xml

  ios-testflight:
    name: SoNo AI - Signed IPA and TestFlight upload
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: "26.1"
      groups:
        - sono_app_store
      vars:
        MARKETING_VERSION: "1.0.0"
        SONO_INSTALL_SIGNING_TOOLS: "1"
    scripts:
      - name: Validate Apple configuration
        script: python3 scripts/ci/pipeline.py preflight
      - name: Prepare tools
        script: bash scripts/ci/bootstrap.sh
      - name: Check workspace and CI scripts
        script: |
          set -euo pipefail
          "$SONO_PYTHON" scripts/check_workspace.py
          "$SONO_PYTHON" -m unittest discover -s scripts/tests -v
      - name: Test financial core
        script: bash scripts/ci/test_core.sh
      - name: Select next build number and generate project
        script: |
          set -euo pipefail
          "$SONO_PYTHON" scripts/ci/pipeline.py prepare --release
          xcodegen generate --spec project.ci.json
      - name: Test native app on iPhone Simulator
        script: bash scripts/ci/test_ios.sh
      - name: Fetch signing assets and export signed IPA
        script: bash scripts/ci/build_ipa.sh
      - name: Verify exported IPA metadata
        script: '"$SONO_PYTHON" scripts/ci/pipeline.py verify-ipa'
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive/dSYMs/*.dSYM
      - build/logs/*.log
      - build/test-results/*.xcresult
      - build/test-results/*.xml
      - build/release/metadata.json
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Upload for internal TestFlight selection in App Store Connect.
        # External beta review and App Store submission are separate actions.
        submit_to_testflight: false
        submit_to_app_store: false
